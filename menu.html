<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TrueSight
    </title>
    <link rel="stylesheet" href="styles.css">
    <style>
        
    </style>
</head>

<body>

    <h2 class = "title">TrueSight</h2>

    <!-- User Info    -->
    <div class = "user-info">
        <img id="profileImage" src="./icons/bronze.png" alt="Profile Rank" class="rank">
        <div class="username">Username</div>
    </div>

    <!-- Child Mode -->
     <div class="settings child-mode">
        <label for="childMode">Block Mode</label>
        <input type="checkbox" id="childMode">
    </div>

    <div class="block">
            Adjust flag to block entire post if checked.
    </div>

    <!-- Post Flag Threshold -->
     <div class="settings post-flag-threshold">
        <label for="Threshold">
            Post Flag Threshold
        </label>
        <input
            type="range"
            id="Threshold"
            min="1"
            max="100"
            value="1"
            step="1"
        >
        <span id="thresholdValue">1</span>
    </div>

    <div class="description" id="thresholdDescription">
        Test Description
    </div>

    <div class="description">
        Highlight users once their posts reach this number of flags.
    </div>

    <script src="menu.js"></script>

</body>
</html>
